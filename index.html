<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoicify - ERP</title>
    <!-- Icons & PDF Libraries -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar"><!-- Unified sidebar injected by layout.js --></aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Dashboard moved to separate page; default view is Editor/Documents -->

            <!-- VIEW: DOCUMENTS LIST -->
            <section id="view-documents" class="view">
                <header class="view-header">
                    <h1>Documents</h1>
                    <button class="btn btn-primary" onclick="window.location.hash='#editor'">+ New</button>
                </header>
                <div class="card table-container">
                    <table id="docs-table" class="full-width">
                        <thead><tr><th>ID</th><th>Type</th><th>Customer</th><th>Date</th><th>Amount</th><th>Actions</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <!-- VIEW: EDITOR -->
            <section id="view-editor" class="view">
                <div class="editor-layout">
                    <!-- Left: Form -->
                    <div class="editor-form">
                        <div class="card">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Type</label>
                                    <select id="doc-type">
                                        <option value="invoice">Invoice</option>
                                        <option value="quotation">Quotation</option>
                                        <option value="estimate">Estimate</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Page Size</label>
                                    <select id="doc-size">
                                        <option value="a4">A4</option>
                                        <option value="letter">Letter</option>
                                        <option value="legal">Legal</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group"><label>Doc Number</label><input type="text" id="doc-number"></div>
                                <div class="form-group"><label>Issue Date</label><input type="date" id="doc-date"></div>
                            </div>
                            <div class="form-group"><label>Due / Valid Until</label><input type="date" id="doc-due-date"></div>
                        </div>

                        <div class="card">
                            <h3>Customer</h3>
                            <div class="form-group">
                                <label>Select Existing or Type New</label>
                                <input type="text" id="cust-name" placeholder="Client Name" list="customer-list">
                                <datalist id="customer-list"></datalist>
                            </div>
                            <div class="form-row">
                                <input type="email" id="cust-email" placeholder="Email">
                                <input type="text" id="cust-phone" placeholder="Phone">
                            </div>
                            <input type="text" id="cust-address" placeholder="Address">
                        </div>

                        <div class="card">
                            <h3>Line Items</h3>
                            <table class="editor-items-table">
                                <thead><tr><th>Item</th><th width="60">Qty</th><th width="80">Price</th><th width="60">Tax%</th><th width="20"></th></tr></thead>
                                <tbody id="line-items-body"></tbody>
                            </table>
                            <button type="button" class="btn btn-secondary btn-sm" id="btn-add-row">+ Add Item</button>
                        </div>

                        <div class="card">
                            <h3>Totals & Notes</h3>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Discount</label>
                                    <div class="input-group">
                                        <input type="number" id="discount-val" value="0">
                                        <select id="discount-type"><option value="fixed">$</option><option value="percent">%</option></select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Shipping Charges</label>
                                    <input type="number" id="shipping-val" value="0" step="0.01" min="0">
                                </div>
                            </div>
                            <div class="form-group"><label>Notes / Terms</label><textarea id="doc-notes" rows="3"></textarea></div>
                        </div>

                        <div class="editor-actions">
                            <button class="btn btn-secondary" id="btn-save">Save Draft</button>
                            <button class="btn btn-primary" id="btn-generate-pdf">Download PDF</button>
                        </div>
                    </div>

                    <!-- Right: Live Preview -->
                    <div class="editor-preview">
                        <div id="preview-container"></div>
                    </div>
                </div>
            </section>

            <!-- VIEW: SETTINGS -->
            <section id="view-settings" class="view">
                <header class="view-header"><h1>Business Settings</h1></header>
                <div class="card" style="max-width: 600px;">
                    <h3>Branding & Layout</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Logo (Image)</label>
                            <input type="file" id="biz-logo" accept="image/*">
                            <small class="text-muted">Stored locally.</small>
                        </div>
                        <div class="form-group" style="text-align:center;">
                            <label>Preview</label>
                            <img id="logo-preview" style="max-height: 50px; display:block; margin:0 auto; border: 1px solid #ddd;">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group"><label>Theme Color</label><input type="color" id="biz-color" style="height: 45px; padding: 2px; width: 100%;"></div>
                        <div class="form-group"><label>Currency</label><input type="text" id="biz-currency" placeholder="e.g. LKR"></div>
                    </div>
                    <hr>
                    <h3>Company Info</h3>
                    <div class="form-group"><label>Business Name</label><input type="text" id="biz-name"></div>
                    <div class="form-group"><label>Address</label><textarea id="biz-address" rows="3"></textarea></div>
                    <div class="form-row">
                        <input type="text" id="biz-phone" placeholder="Phone">
                        <input type="email" id="biz-email" placeholder="Email">
                    </div>
                    <hr>
                    <h3>Bank Details</h3>
                    <div class="form-group">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="show-bank-details" style="width: auto;">
                            <span>Show bank details on invoices</span>
                        </label>
                    </div>
                    <div class="form-group"><label>Bank Name</label><input type="text" id="bank-name"></div>
                    <div class="form-group"><label>Branch</label><input type="text" id="bank-branch"></div>
                    <div class="form-group"><label>Account No.</label><input type="text" id="bank-acc"></div>
                    
                    <button class="btn btn-primary" id="btn-save-settings">Save Settings</button>
                    <button class="btn btn-secondary" id="btn-clear-logo" style="margin-left: 10px;">Remove Logo</button>
                </div>
            </section>
            
            <!-- VIEW: CUSTOMERS -->
            <section id="view-customers" class="view">
                <header class="view-header"><h1>Customers</h1></header>
                <div class="card">
                    <table id="customers-table" class="full-width">
                        <thead><tr><th>Name</th><th>Email</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <div id="toast" class="toast"></div>
    <div id="product-error" class="alert" style="display:none"></div>
    <div id="product-empty" class="empty" style="display:none">No products available yet.</div>
    <script type="module">
        // Protect this page - redirect to login if not authenticated
        import ApiClient from './js/api-client.js';
        import { setupLogout } from './js/auth.js';
        import './js/layout.js';
        
        if (!ApiClient.isAuthenticated()) {
            window.location.replace('/login.html');
        }
        setupLogout(); // ensure logout binding even if layout injection delayed
    </script>
    <script type="module" src="js/app.js"></script>
</body>
    <div id="product-error" class="alert" style="display:none"></div>
    <div id="product-empty" class="empty" style="display:none">No products available yet.</div>
</html>
