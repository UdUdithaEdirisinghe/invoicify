<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory - Invoicify</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar"><!-- Unified sidebar injected by layout.js --></aside>

    <main class="main-content">
      <header class="view-header">
        <h1>Inventory</h1>
        <div id="user-info" style="color:#64748b"></div>
      </header>

      <div class="card" style="margin-bottom:20px;">
        <h3>Add Product</h3>
        <form id="product-form" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap:12px;">
          <input type="text" id="name" placeholder="Name" required />
          <input type="text" id="sku" placeholder="SKU" />
          <input type="number" id="unitPrice" placeholder="Unit Price" step="0.01" />
          <input type="number" id="quantity" placeholder="Initial Quantity" />
          <input type="number" id="lowStockThreshold" placeholder="Low Stock Threshold" />
          <input type="text" id="description" placeholder="Description" />
          <button type="submit" class="primary-btn">Create</button>
        </form>
      </div>

      <div class="table-container card">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>SKU</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Low</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="products-tbody">
            <tr><td colspan="6" style="text-align:center; padding:20px; color:#94a3b8;">Loading products...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { requireAuth, getCurrentUser } from './js/auth.js';
    import ApiClient from './js/api-client.js';
    import './js/layout.js';

    if (!requireAuth()) throw new Error('Not authenticated');

    const tbody = document.getElementById('products-tbody');
    const form = document.getElementById('product-form');

    async function loadProducts() {
      try {
        const response = await ApiClient.getProducts();
        const list = response.data || response; // handler returns {data: [...]} or array
        if (!list || list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:#94a3b8;">No products yet</td></tr>';
          return;
        }
        tbody.innerHTML = list.map(p => {
          const qty = Number(p.current_quantity || 0);
          const threshold = Number(p.stock_threshold || 0);
          let qtyCell = `${qty}`;
          if (qty === 0) {
            qtyCell = `${qty} <span class="badge badge-out"><i class="ph ph-x-circle"></i>Out of Stock</span>`;
          } else if (qty <= threshold) {
            qtyCell = `${qty} <span class="badge badge-low"><i class="ph ph-warning"></i>Low</span>`;
          }
          return `
          <tr>
            <td>${p.name}</td>
            <td>${p.sku || ''}</td>
            <td>LKR ${Number(p.unit_price || 0).toFixed(2)}</td>
            <td>${qtyCell}</td>
            <td>${threshold}</td>
            <td class="actions-cell">
              <div class="actions-row">
                <button class="icon-btn more-btn" data-id="${p.id}" title="Actions" aria-haspopup="menu" aria-expanded="false">
                  <i class="ph ph-dots-three-outline-vertical"></i>
                </button>
                <div class="row-menu" role="menu" hidden>
                  <button class="menu-item" data-action="in" role="menuitem">
                    <i class="ph ph-arrow-up"></i>
                    <span>Stock In</span>
                  </button>
                  <button class="menu-item" data-action="out" role="menuitem">
                    <i class="ph ph-arrow-down"></i>
                    <span>Stock Out</span>
                  </button>
                  <button class="menu-item" data-action="adjust" role="menuitem">
                    <i class="ph ph-sliders"></i>
                    <span>Adjust</span>
                  </button>
                  <button class="menu-item danger" data-action="delete" role="menuitem">
                    <i class="ph ph-trash"></i>
                    <span>Delete</span>
                  </button>
                </div>
              </div>
            </td>
          </tr>`;
        }).join('');

        // Update current list reference for delegated handlers
        currentProductsList = list;

        // Wire delegated handlers once
        if (!menusWired) {
          // Toggle/open menu or perform action from menu item
          tbody.addEventListener('click', async (e) => {
            const moreBtn = e.target.closest('.more-btn');
            if (moreBtn) {
              e.preventDefault();
              const cell = moreBtn.closest('.actions-cell');
              const expanded = moreBtn.getAttribute('aria-expanded') === 'true';
              closeAllMenus();
              if (!expanded) {
                cell.classList.add('open');
                moreBtn.setAttribute('aria-expanded', 'true');
                const menu = cell.querySelector('.row-menu');
                if (menu) menu.hidden = false;
                const firstItem = cell.querySelector('.row-menu .menu-item');
                if (firstItem) firstItem.focus();
              }
              return;
            }

            const itemBtn = e.target.closest('.row-menu .menu-item');
            if (itemBtn) {
              e.preventDefault();
              const cell = itemBtn.closest('.actions-cell');
              const id = cell.querySelector('.more-btn')?.dataset.id;
              const action = itemBtn.dataset.action;
              if (!id || !action) return;

              if (action === 'delete') {
                if (!confirm('Delete product?')) return closeAllMenus();
                await ApiClient.deleteProduct(id);
                closeAllMenus();
                await loadProducts();
                return;
              }

              const current = (currentProductsList || []).find(x => String(x.id) === String(id));
              if (!current) { closeAllMenus(); return; }

              if (action === 'adjust') {
                const qtyStr = prompt('Set quantity to:', current.current_quantity);
                if (qtyStr === null) return closeAllMenus();
                const newQty = parseInt(qtyStr, 10);
                if (Number.isNaN(newQty) || newQty < 0) { alert('Invalid quantity'); return closeAllMenus(); }
                try {
                  await ApiClient.updateProduct(id, {
                    name: current.name,
                    sku: current.sku,
                    description: current.description,
                    product_category_id: current.product_category_id,
                    unit_price: current.unit_price,
                    cost_price: current.cost_price,
                    current_quantity: newQty,
                    stock_threshold: current.stock_threshold
                  });
                  closeAllMenus();
                  await loadProducts();
                  alert(`Quantity adjusted successfully! New quantity: ${newQty}`);
                } catch (err) {
                  console.error('Adjust failed:', err);
                  alert('Failed to adjust quantity: ' + (err.message || 'Unknown error'));
                }
                return;
              }

              // Stock In / Out
              const qtyStr = prompt(action === 'in' ? 'Add quantity:' : 'Remove quantity:');
              if (!qtyStr) { closeAllMenus(); return; }
              const delta = parseInt(qtyStr, 10);
              if (Number.isNaN(delta) || delta <= 0) { alert('Invalid quantity'); closeAllMenus(); return; }
              let newQty = parseInt(current.current_quantity || 0, 10);
              newQty = action === 'in' ? newQty + delta : Math.max(0, newQty - delta);
              try {
                await ApiClient.updateProduct(id, {
                  name: current.name,
                  sku: current.sku,
                  description: current.description,
                  product_category_id: current.product_category_id,
                  unit_price: current.unit_price,
                  cost_price: current.cost_price,
                  current_quantity: newQty,
                  stock_threshold: current.stock_threshold
                });
                closeAllMenus();
                await loadProducts();
                alert(`Stock ${action === 'in' ? 'added' : 'removed'} successfully! New quantity: ${newQty}`);
              } catch (err) {
                console.error('Stock update failed:', err);
                alert('Failed to update stock: ' + (err.message || 'Unknown error'));
              }
            }
          });

          // Close on outside click
          document.addEventListener('click', (ev) => {
            if (!ev.target.closest('.actions-cell')) closeAllMenus();
          });

          // Close on Escape
          document.addEventListener('keydown', (ev) => {
            if (ev.key === 'Escape') closeAllMenus();
          });

          menusWired = true;
        }
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; color:#ef4444;">Failed to load products</td></tr>';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: document.getElementById('name').value.trim(),
        sku: document.getElementById('sku').value.trim(),
        unit_price: parseFloat(document.getElementById('unitPrice').value || '0'),
        current_quantity: parseInt(document.getElementById('quantity').value || '0', 10),
        stock_threshold: parseInt(document.getElementById('lowStockThreshold').value || '0', 10),
        description: document.getElementById('description').value.trim()
      };
      if (!body.name) return alert('Name is required');
      await ApiClient.createProduct(body);
      form.reset();
      await loadProducts();
    });

    // Track current list + dropdown menu wiring
    let currentProductsList = [];
    let menusWired = false;

    function closeAllMenus() {
      document.querySelectorAll('.actions-cell.open').forEach(cell => {
        const btn = cell.querySelector('.more-btn');
        const menu = cell.querySelector('.row-menu');
        cell.classList.remove('open');
        if (btn) btn.setAttribute('aria-expanded', 'false');
        if (menu) menu.hidden = true;
      });
    }

    (async () => {
      const user = await getCurrentUser();
      if (user) document.getElementById('user-info').textContent = `Logged in as: ${user.username}`;
      await loadProducts();
    })();
  </script>

  <!-- Load layout.js for unified sidebar -->
  <script type="module">
    import './js/layout.js';
  </script>
</body>
</html>
