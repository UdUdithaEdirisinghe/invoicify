<!DOCTYPE html>
<html>
<head>
  <title>Change Password Button Test</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
    .test-section { margin: 20px 0; padding: 20px; border: 2px solid #e2e8f0; border-radius: 8px; }
    .success { background: #d1fae5; border-color: #10b981; }
    .error { background: #fee2e2; border-color: #ef4444; }
    button { padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #2563eb; }
    input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #e2e8f0; border-radius: 6px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    #console { background: #1e293b; color: #e2e8f0; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>🔐 Change Password Button Test</h1>
  
  <div class="test-section">
    <h2>Instructions</h2>
    <ol>
      <li>Open browser console (F12)</li>
      <li>Fill in the password fields below</li>
      <li>Click "Change Password" button</li>
      <li>Watch for console messages and test results</li>
    </ol>
  </div>

  <div class="test-section">
    <h2>Password Fields</h2>
    
    <label>Current Password</label>
    <input type="password" id="current-password" placeholder="Enter current password">
    
    <label>New Password</label>
    <input type="password" id="new-password" placeholder="Enter new password (min 6 chars)">
    
    <label>Confirm Password</label>
    <input type="password" id="confirm-password" placeholder="Confirm new password">
    
    <br><br>
    <button type="button" id="change-password-btn">🔑 Change Password</button>
  </div>

  <div class="test-section">
    <h2>Console Output</h2>
    <div id="console"></div>
  </div>

  <script>
    // Capture console.log
    const consoleDiv = document.getElementById('console');
    const originalLog = console.log;
    const originalError = console.error;
    
    function addToConsole(message, type = 'log') {
      const timestamp = new Date().toLocaleTimeString();
      const prefix = type === 'error' ? '❌' : type === 'success' ? '✓' : '•';
      consoleDiv.textContent += `[${timestamp}] ${prefix} ${message}\n`;
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }
    
    console.log = function(...args) {
      originalLog.apply(console, args);
      addToConsole(args.join(' '), 'log');
    };
    
    console.error = function(...args) {
      originalError.apply(console, args);
      addToConsole(args.join(' '), 'error');
    };

    // Test the change password functionality
    async function handlePasswordChange() {
      console.log('🔐 Change password clicked');
      
      const currentPassword = document.getElementById('current-password').value.trim();
      const newPassword = document.getElementById('new-password').value.trim();
      const confirmPassword = document.getElementById('confirm-password').value.trim();

      console.log('Password fields:', {
        current: currentPassword ? '***filled***' : 'empty',
        new: newPassword ? '***filled***' : 'empty', 
        confirm: confirmPassword ? '***filled***' : 'empty'
      });

      // Validation
      if (!currentPassword) {
        console.error('Validation failed: Current password empty');
        alert('Please enter your current password');
        return;
      }

      if (!newPassword) {
        console.error('Validation failed: New password empty');
        alert('Please enter a new password');
        return;
      }

      if (newPassword.length < 6) {
        console.error('Validation failed: Password too short');
        alert('New password must be at least 6 characters');
        return;
      }

      if (!confirmPassword) {
        console.error('Validation failed: Confirm password empty');
        alert('Please confirm your new password');
        return;
      }

      if (newPassword !== confirmPassword) {
        console.error('Validation failed: Passwords do not match');
        alert('New passwords do not match');
        return;
      }

      if (currentPassword === newPassword) {
        console.error('Validation failed: Same password');
        alert('New password must be different from current password');
        return;
      }

      console.log('✓ All validations passed!');
      alert('✓ Validation passed! In real app, this would call the API.');
    }

    // Attach event listener
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('change-password-btn');
      if (btn) {
        btn.addEventListener('click', handlePasswordChange);
        console.log('✓ Change password button listener attached');
      } else {
        console.error('❌ Change password button not found!');
      }
      
      console.log('Page loaded. Ready for testing.');
    });
  </script>
</body>
</html>
