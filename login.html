<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Invoicify</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="brand">
            <i class="ph ph-hexagon-fill"></i>
            <h1>Invoicify</h1>
            <p>Welcome back! Please login to continue.</p>
        </div>

        <div id="error-message" class="error-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Log In</button>
        </form>

        <div class="form-footer">
            Don't have an account? <a href="/register.html">Create one</a>
        </div>
    </div>

    <script type="module">
        import { setupLoginForm } from './js/auth.js';
        import ApiClient from './js/api-client.js';

        // Redirect if already logged in - but wait for DOM to be ready
        // This prevents race conditions during logout
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkAuthAndInit);
        } else {
            checkAuthAndInit();
        }

        function checkAuthAndInit() {
            // Double-check token is valid before redirecting
            if (ApiClient.isAuthenticated()) {
                // Verify token with server before redirecting
                ApiClient.verifyToken()
                    .then(() => {
                        window.location.replace('/dashboard.html');
                    })
                    .catch(() => {
                        // Token invalid, stay on login page
                        ApiClient.removeToken();
                        setupLoginForm();
                    });
            } else {
                setupLoginForm();
            }
        }
    </script>
</body>
</html>
