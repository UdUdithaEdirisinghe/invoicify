<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Invoicify</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <i class="ph ph-hexagon-fill"></i> Invoicify
            </div>
            <nav>
                <a href="/dashboard.html" class="nav-link active"><i class="ph ph-squares-four"></i> Dashboard</a>
                <a href="/index.html#editor" class="nav-link"><i class="ph ph-plus-circle"></i> New Invoice</a>
                <a href="/inventory.html" class="nav-link"><i class="ph ph-package"></i> Inventory</a>
                <a href="/index.html#settings" class="nav-link"><i class="ph ph-gear"></i> Settings</a>
            </nav>
            <div style="padding: 20px; margin-top: auto;">
                <button class="logout-btn" style="width: 100%; padding: 10px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer;">
                    <i class="ph ph-sign-out"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="view-header">
                <h1>Dashboard</h1>
                <div id="user-info" style="color: #64748b;"></div>
            </header>

            <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div class="card stat-card">
                    <h3>Total Invoices</h3>
                    <p id="total-count" style="font-size: 32px; font-weight: bold; color: #2563eb;">0</p>
                </div>
                <div class="card stat-card">
                    <h3>Total Revenue</h3>
                    <p id="total-revenue" style="font-size: 32px; font-weight: bold; color: #059669;">LKR 0.00</p>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Your Invoices</h2>
                <button id="new-invoice-btn" style="padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer;">
                    <i class="ph ph-plus"></i> New Invoice
                </button>
            </div>

            <div class="table-container card">
                <table id="invoices-table">
                    <thead>
                        <tr>
                            <th>Invoice #</th>
                            <th>Customer</th>
                            <th>Date</th>
                            <th>Total</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="invoices-tbody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 40px; color: #94a3b8;">
                                Loading invoices...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        import { requireAuth, getCurrentUser, setupLogout } from './js/auth.js';
        import ApiClient from './js/api-client.js';

        // Protect this page
        if (!requireAuth()) {
            throw new Error('Not authenticated');
        }

        setupLogout();

        // Load user info and invoices
        async function init() {
            try {
                // Get current user
                const user = await getCurrentUser();
                if (user) {
                    document.getElementById('user-info').textContent = `Logged in as: ${user.username}`;
                }

                // Load invoices
                await loadInvoices();
            } catch (error) {
                console.error('Failed to initialize:', error);
            }
        }

        async function loadInvoices() {
            try {
                const response = await ApiClient.getInvoices();
                const invoices = response.invoices || [];

                const tbody = document.getElementById('invoices-tbody');
                
                if (invoices.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 40px; color: #94a3b8;">
                                No invoices yet. Create your first invoice!
                            </td>
                        </tr>
                    `;
                    updateStats(0, 0);
                    return;
                }

                // Calculate stats
                const totalRevenue = invoices.reduce((sum, inv) => {
                    return sum + (inv.data?.totals?.grandTotal || 0);
                }, 0);

                updateStats(invoices.length, totalRevenue);

                // Render table
                tbody.innerHTML = invoices.map(invoice => {
                    const data = invoice.data;
                    const date = new Date(invoice.createdAt).toLocaleDateString();
                    const total = data?.totals?.grandTotal || 0;
                    const currency = data?.settings?.currency || 'LKR';
                    
                    return `
                        <tr>
                            <td>${data?.number || 'N/A'}</td>
                            <td>${data?.customer?.name || 'Unknown'}</td>
                            <td>${date}</td>
                            <td>${currency} ${total.toFixed(2)}</td>
                            <td>
                                <button class="view-btn" data-id="${invoice.id}" style="padding: 6px 12px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px;">
                                    View
                                </button>
                                <button class="delete-btn" data-id="${invoice.id}" style="padding: 6px 12px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer;">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

                // Add event listeners
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.dataset.id;
                        if (confirm('Are you sure you want to delete this invoice?')) {
                            try {
                                await ApiClient.deleteInvoice(id);
                                await loadInvoices(); // Reload
                            } catch (error) {
                                alert('Failed to delete invoice: ' + error.message);
                            }
                        }
                    });
                });

                document.querySelectorAll('.view-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = e.target.dataset.id;
                        window.location.href = `/index.html#editor?id=${id}`;
                    });
                });

            } catch (error) {
                console.error('Failed to load invoices:', error);
                document.getElementById('invoices-tbody').innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 40px; color: #ef4444;">
                            Failed to load invoices. Please try again.
                        </td>
                    </tr>
                `;
            }
        }

        function updateStats(count, revenue) {
            document.getElementById('total-count').textContent = count;
            document.getElementById('total-revenue').textContent = `LKR ${revenue.toFixed(2)}`;
        }

        // New invoice button
        document.getElementById('new-invoice-btn').addEventListener('click', () => {
            window.location.href = '/index.html#editor';
        });

        // Initialize
        init();
    </script>
</body>
</html>
