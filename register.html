<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Invoicify</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="brand">
            <i class="ph ph-hexagon-fill"></i>
            <h1>Invoicify</h1>
            <p>Create your account and setup your business.</p>
        </div>

        <div id="error-message" class="error-message"></div>

        <form id="register-form">
            <div class="form-section">
                <h3><i class="ph ph-user"></i> Account</h3>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" minlength="3" maxlength="50">
                    <div class="password-requirements">3-50 characters</div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" minlength="6">
                    <div class="password-requirements">At least 6 characters</div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" minlength="6">
                </div>
            </div>
            
            <div class="form-section">
                <h3><i class="ph ph-buildings"></i> Business Info</h3>
                <div class="form-group">
                    <label for="business-name">Business Name</label>
                    <input type="text" id="business-name" name="business-name" required>
                </div>
                
                <div class="form-group">
                    <label for="business-address">Address</label>
                    <textarea id="business-address" name="business-address" required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="business-phone">Phone</label>
                        <input type="tel" id="business-phone" name="business-phone" placeholder="+94 XX XXX XXXX">
                    </div>
                    
                    <div class="form-group">
                        <label for="business-email">Business Contact Email (optional)</label>
                        <input type="email" id="business-email" name="business-email" placeholder="accounts@yourcompany.com">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="currency">Currency</label>
                    <input type="text" id="currency" name="currency" value="LKR" required maxlength="10" placeholder="e.g. LKR, USD, EUR">
                </div>
            </div>
            
            <div class="form-section">
                <h3><i class="ph ph-paint-brush"></i> Branding</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="logo-upload">Logo (Optional)</label>
                        <input type="file" id="logo-upload" name="logo-upload" accept="image/*">
                        <div class="password-requirements">Will appear on invoices</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="theme-color">Theme Color</label>
                        <input type="color" id="theme-color" name="theme-color" value="#2563eb" style="height: 45px; width: 100%; cursor: pointer;">
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Create Account</button>
        </form>

        <div class="form-footer">
            Already have an account? <a href="/login.html">Log in</a>
        </div>
    </div>

    <script type="module">
        import { setupRegisterForm } from './js/auth.js';
        import ApiClient from './js/api-client.js';

        // Redirect if already logged in
        if (ApiClient.isAuthenticated()) {
            window.location.href = '/dashboard.html';
        } else {
            setupRegisterForm();
        }
    </script>
</body>
</html>
