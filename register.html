<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Invoicify</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
            padding: 40px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .form-section {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .form-section:last-of-type {
            border-bottom: none;
        }
        
        .form-section h3 {
            font-size: 18px;
            color: #2d3748;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand i {
            font-size: 48px;
            color: #667eea;
        }

        .brand h1 {
            font-size: 28px;
            color: #1a202c;
            margin-top: 10px;
        }

        .brand p {
            color: #718096;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .error-message {
            background: #fee;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-footer {
            text-align: center;
            margin-top: 24px;
            color: #718096;
            font-size: 14px;
        }

        .form-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .password-requirements {
            font-size: 12px;
            color: #718096;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="brand">
            <i class="ph ph-hexagon-fill"></i>
            <h1>Invoicify</h1>
            <p>Create your account and setup your business.</p>
        </div>

        <div id="error-message" class="error-message"></div>

        <form id="register-form">
            <div class="form-section">
                <h3><i class="ph ph-user"></i> Account</h3>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" minlength="3" maxlength="50">
                    <div class="password-requirements">3-50 characters</div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" minlength="6">
                    <div class="password-requirements">At least 6 characters</div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" minlength="6">
                </div>
            </div>
            
            <div class="form-section">
                <h3><i class="ph ph-buildings"></i> Business Info</h3>
                <div class="form-group">
                    <label for="business-name">Business Name</label>
                    <input type="text" id="business-name" name="business-name" required>
                </div>
                
                <div class="form-group">
                    <label for="business-address">Address</label>
                    <textarea id="business-address" name="business-address" required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="business-phone">Phone</label>
                        <input type="tel" id="business-phone" name="business-phone" placeholder="+94 XX XXX XXXX">
                    </div>
                    
                    <div class="form-group">
                        <label for="business-email">Email</label>
                        <input type="email" id="business-email" name="business-email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="currency">Currency</label>
                    <input type="text" id="currency" name="currency" value="LKR" required maxlength="10" placeholder="e.g. LKR, USD, EUR">
                </div>
            </div>
            
            <div class="form-section">
                <h3><i class="ph ph-paint-brush"></i> Branding</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="logo-upload">Logo (Optional)</label>
                        <input type="file" id="logo-upload" name="logo-upload" accept="image/*">
                        <div class="password-requirements">Will appear on invoices</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="theme-color">Theme Color</label>
                        <input type="color" id="theme-color" name="theme-color" value="#2563eb" style="height: 45px; width: 100%; cursor: pointer;">
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Create Account</button>
        </form>

        <div class="form-footer">
            Already have an account? <a href="/login.html">Log in</a>
        </div>
    </div>

    <script type="module">
        import { setupRegisterForm } from './js/auth.js';
        import ApiClient from './js/api-client.js';

        // Redirect if already logged in
        if (ApiClient.isAuthenticated()) {
            window.location.href = '/dashboard.html';
        } else {
            setupRegisterForm();
        }
    </script>
</body>
</html>
